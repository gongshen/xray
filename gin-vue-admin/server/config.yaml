# JWT 配置
jwt:
  signing-key: qmPlus
  expires-time: 7d
  buffer-time: 1d
  issuer: qmPlus

# 日志配置
zap:
  level: info
  prefix: '[xray-admin]'
  format: console
  director: log
  encode-level: LowercaseColorLevelEncoder
  stacktrace-key: stacktrace
  max-age: 0
  show-line: true
  log-in-console: true

# 系统配置
system:
  env: public
  addr: 8888
  db-type: mysql
  oss-type: local
  use-multipoint: false
  use-redis: false
  iplimit-count: 500
  iplimit-time: 3600
  router-prefix: ""

# 验证码配置
captcha:
  key-long: 6
  img-width: 240
  img-height: 80
  open-captcha: 0
  open-captcha-timeout: 3600

# MySQL 配置 (通过初始化接口配置)
mysql:
  path: ""
  port: ""
  config: ""
  db-name: ""
  username: ""
  password: ""
  max-idle-conns: 10
  max-open-conns: 100
  log-mode: error
  log-zap: false

# 本地文件存储
local:
  path: uploads/file
  store-path: uploads/file

stat_port: 56611
traffic_collect_interval: 1h
sysinfo_collect_interval: 5m
traffic-meter:
  enable: true
  stat-url: http://127.0.0.1:56611
  tag: "1"
  flush-interval: 10s
silicon-flow:
  api-key: ""
  base-url: https://api.siliconflow.cn
  model: deepseek-ai/DeepSeek-V3.2
  timeout: 90s

# 定时任务
timer:
  start: true
  spec: '@daily'
  detail:
  - tableName: sys_operation_records
    compareField: created_at
    interval: 2160h
  - tableName: jwt_blacklists
    compareField: created_at
    interval: 168h
